<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="toolbox-panel-title toolbox-panel-desc">
  <title id="toolbox-panel-title">Toolbox panel</title>
  <desc id="toolbox-panel-desc">Five technology categories and the tools reached for in each, for mightbechr1s.</desc>
  <defs>
    <style type="text/css">
      /* Caret blink after the headline */
      @keyframes tbCaret { 0%, 100% { opacity: 1; } 50% { opacity: .12; } }
      .tb-caret { animation: tbCaret 1.4s steps(1) infinite; }

      /* Low-opacity background sweep */
      @keyframes tbSweep { from { transform: translateX(0); } to { transform: translateX(1500px); } }
      .tb-sweep { animation: tbSweep 14s linear infinite; }

      /* Quiet category-icon pulse */
      @keyframes tbIconPulse { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }
      .tb-icon { animation: tbIconPulse 4.8s ease-in-out infinite; }
      .tb-icon-2 { animation-delay: .45s; }
      .tb-icon-3 { animation-delay: .9s; }
      .tb-icon-4 { animation-delay: 1.35s; }
      .tb-icon-5 { animation-delay: 1.8s; }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="tb-sweep-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e2e8f0" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tb-clip"><rect width="1200" height="370" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="370" rx="16" fill="url(#tb-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="369" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.65"/>

  <!-- Low-opacity sweep band -->
  <g clip-path="url(#tb-clip)">
    <g transform="rotate(-6 600 185)">
      <rect class="tb-sweep" x="-260" y="-140" width="220" height="650" fill="url(#tb-sweep-fill)"/>
    </g>
  </g>

  <!-- Header -->
  <text x="70" y="54" font-family="Consolas, ui-monospace, monospace" font-size="18" font-weight="700" letter-spacing="3" fill="#38bdf8">// TOOLBOX.CONF</text>
  <text x="70" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" letter-spacing="0" fill="#f8fafc">TOOLBOX</text>
  <rect class="tb-caret" x="313" y="70" width="4" height="38" rx="2" fill="#38bdf8"/>
  <text x="970" y="96" font-family="Consolas, ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="2" fill="#94a3b8">5 CATEGORIES</text>
  <path d="M70 132h1060" stroke="#334155" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Category icons -->
  <g fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Interfaces: browser window -->
    <g class="tb-icon" transform="translate(70 150)">
      <rect width="28" height="22" rx="3"/>
      <path d="M0 7h28M5 3.5h.1M10 3.5h.1"/>
    </g>
    <!-- Services: API brackets -->
    <g class="tb-icon tb-icon-2" transform="translate(70 194)">
      <path d="m9 2-7 9 7 9m10-18 7 9-7 9M16 0l-5 22"/>
    </g>
    <!-- Data: database -->
    <g class="tb-icon tb-icon-3" transform="translate(70 237)">
      <ellipse cx="14" cy="4" rx="12" ry="4"/>
      <path d="M2 4v16c0 2 5 4 12 4s12-2 12-4V4M2 12c0 2 5 4 12 4s12-2 12-4"/>
    </g>
    <!-- Desktop: monitor -->
    <g class="tb-icon tb-icon-4" transform="translate(70 282)">
      <rect width="28" height="19" rx="3"/>
      <path d="M14 19v6M8 25h12"/>
    </g>
    <!-- Delivery: branch -->
    <g class="tb-icon tb-icon-5" transform="translate(70 323)">
      <circle cx="5" cy="4" r="3"/>
      <circle cx="23" cy="12" r="3"/>
      <circle cx="5" cy="22" r="3"/>
      <path d="M8 4h4c6 0 5 8 8 8M8 22h4c6 0 5-8 8-8"/>
    </g>
  </g>

  <!-- Categories (open rows, tools separated by middle dots) -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="20" font-weight="700" letter-spacing="2" fill="#38bdf8">
    <text x="116" y="170">INTERFACES</text>
    <text x="116" y="214">SERVICES</text>
    <text x="116" y="258">DATA</text>
    <text x="116" y="302">DESKTOP</text>
    <text x="116" y="346">DELIVERY</text>
  </g>
  <g font-family="Consolas, ui-monospace, monospace" font-size="20" font-weight="500" fill="#94a3b8">
    <text x="340" y="170">TypeScript <tspan fill="#38bdf8">·</tspan> React <tspan fill="#38bdf8">·</tspan> Next.js <tspan fill="#38bdf8">·</tspan> Tailwind CSS</text>
    <text x="340" y="214">Python <tspan fill="#38bdf8">·</tspan> FastAPI <tspan fill="#38bdf8">·</tspan> PHP <tspan fill="#38bdf8">·</tspan> REST APIs</text>
    <text x="340" y="258">MySQL <tspan fill="#38bdf8">·</tspan> PostgreSQL <tspan fill="#38bdf8">·</tspan> SQLite <tspan fill="#38bdf8">·</tspan> Supabase</text>
    <text x="340" y="302">Java <tspan fill="#38bdf8">·</tspan> JavaFX <tspan fill="#38bdf8">·</tspan> Maven</text>
    <text x="340" y="346">Git <tspan fill="#38bdf8">·</tspan> GitHub <tspan fill="#38bdf8">·</tspan> Docker <tspan fill="#38bdf8">·</tspan> Vercel</text>
  </g>
</svg>
