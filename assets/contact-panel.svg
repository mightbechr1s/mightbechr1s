<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-labelledby="cta-panel-title cta-panel-desc">
  <title id="cta-panel-title">Contact call to action panel</title>
  <desc id="cta-panel-desc">An invitation to share a bottleneck worth fixing.</desc>
  <defs>
    <style type="text/css">
      /* Caret blink after the headline */
      @keyframes ctaCaret { 0%, 100% { opacity: 1; } 50% { opacity: .12; } }
      .cta-caret { animation: ctaCaret 1.4s steps(1) infinite; }

      /* Low-opacity background sweep */
      @keyframes ctaSweep { from { transform: translateX(0); } to { transform: translateX(1500px); } }
      .cta-sweep { animation: ctaSweep 14s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
    <linearGradient id="cta-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="cta-sweep-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e2e8f0" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cta-clip"><rect width="1200" height="210" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="210" rx="16" fill="url(#cta-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="209" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.65"/>

  <!-- Low-opacity sweep band -->
  <g clip-path="url(#cta-clip)">
    <g transform="rotate(-6 600 130)">
      <rect class="cta-sweep" x="-260" y="-120" width="220" height="500" fill="url(#cta-sweep-fill)"/>
    </g>
  </g>

  <!-- Headline -->
  <text x="70" y="52" font-family="Consolas, ui-monospace, monospace" font-size="18" font-weight="700" letter-spacing="3" fill="#38bdf8">// CONTACT.CTA</text>
  <text x="70" y="106" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" letter-spacing="0" fill="#f8fafc">HAVE A BOTTLENECK WORTH FIXING?</text>
  <rect class="cta-caret" x="937" y="70" width="4" height="38" rx="2" fill="#38bdf8"/>

  <!-- Invitation (one sentence, two lines) -->
  <text x="70" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#f8fafc">Tell me what is slow, repetitive, or getting in the way.</text>
  <text x="70" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#f8fafc">I&apos;ll help turn it into a practical software plan.</text>

</svg>
