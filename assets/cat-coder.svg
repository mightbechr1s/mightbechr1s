<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" role="img" aria-labelledby="cat-coder-title cat-coder-desc">
  <title id="cat-coder-title">Cat coding at a laptop</title>
  <desc id="cat-coder-desc">A navy cat with cyan glasses typing at a small laptop.</desc>
  <defs>
    <style type="text/css">
      /* Restrained pulse on the screen and glasses */
      @keyframes glassesGlow { 0%, 100% { stroke: #22d3ee; } 50% { stroke: #7dd3fc; } }
      @keyframes screenGlow { 0%, 100% { fill: #22d3ee; } 50% { fill: #67e8f9; } }
      .glasses { animation: glassesGlow 3.2s ease-in-out infinite; }
      .screen { animation: screenGlow 3.2s ease-in-out infinite; animation-delay: .5s; }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
    <filter id="cat-coder-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
  </defs>
  <g filter="url(#cat-coder-shadow)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path fill="#0f172a" d="M49 73 45 35l27 18c11-5 25-5 36 0l27-18-4 39c7 9 10 20 8 32-3 22-23 39-49 39s-46-17-49-39c-2-12 1-24 8-33Z"/>
    <path fill="#0891b2" d="M32 101h116l-10 43H42Z"/>
    <path class="screen" fill="#22d3ee" d="M74 116h32l-4 13H78Z"/>
  </g>
  <g class="glasses" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round">
    <rect x="57" y="73" width="25" height="18" rx="7"/>
    <rect x="98" y="73" width="25" height="18" rx="7"/>
    <path d="M82 81h16"/>
  </g>
  <path fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" d="m87 96 3 3 4-3"/>
  <path fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" d="M47 119H22m111 0h25"/>
</svg>