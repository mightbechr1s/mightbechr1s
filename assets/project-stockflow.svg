<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" role="img" aria-labelledby="stockflow-title stockflow-desc">
  <title id="stockflow-title">StockFlow — inventory and sales system card</title>
  <desc id="stockflow-desc">StockFlow project card: stock in, sales out, no notebook. An inventory boxes and rising bars glyph with a growth arrow, a JavaScript, HTML and CSS tech line, and a live demo status.</desc>
  <defs>
    <style type="text/css">
      /* Tallest bar rises gently (glyph animation) */
      @keyframes sfGrow {
        0%, 100% { transform: scaleY(1); }
        50%      { transform: scaleY(1.06); }
      }
      .grow { animation: sfGrow 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }

      /* Low-opacity background sweep */
      @keyframes sweep {
        0%   { transform: translateX(-760px); }
        100% { transform: translateX(760px); }
      }
      .sweep { animation: sweep 14s ease-in-out infinite alternate; }

      @media (prefers-reduced-motion: reduce) {
        .sweep { animation: none !important; opacity: 0 !important; }
        .grow { animation: none !important; }
      }
    </style>
    <linearGradient id="stockflow-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".04"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="stockflow-clip">
      <rect x="0" y="0" width="600" height="370" rx="16"/>
    </clipPath>
  </defs>

  <!-- Card surface + subtle 1px outer stroke -->
  <rect x="0" y="0" width="600" height="370" rx="16" fill="#101827"/>
  <rect x="0.5" y="0.5" width="599" height="369" rx="16" fill="none" stroke="#334155" stroke-opacity=".65" stroke-width="1"/>

  <!-- Background sweep, clipped to the card -->
  <g clip-path="url(#stockflow-clip)">
    <rect class="sweep" x="-160" y="-60" width="320" height="490" fill="url(#stockflow-sweep)"/>
  </g>

  <!-- Status: tiny dot + mono label, right aligned -->
  <circle cx="486" cy="30" r="3" fill="#34d399"/>
  <text x="564" y="36" text-anchor="end" font-family="Consolas, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#94a3b8">LIVE DEMO</text>

  <!-- Accent rule, title, tagline -->
  <rect x="36" y="64" width="30" height="3" rx="1.5" fill="#38bdf8"/>
  <text x="34" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#f8fafc">STOCKFLOW</text>
  <text x="36" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">Stock in, sales out, no notebook.</text>

  <!-- Inventory boxes and rising bars glyph (clean line art) -->
  <rect x="400" y="152" width="26" height="22" rx="5" fill="#101827" stroke="#38bdf8" stroke-width="3.5"/>
  <rect x="400" y="176" width="26" height="22" rx="5" fill="#101827" stroke="#38bdf8" stroke-width="3.5"/>
  <rect x="392" y="224" width="146" height="3" rx="1.5" fill="#94a3b8" opacity=".35"/>
  <rect x="432" y="184" width="22" height="40" rx="5" fill="#101827" stroke="#38bdf8" stroke-width="3.5"/>
  <rect x="466" y="152" width="22" height="72" rx="5" fill="#101827" stroke="#38bdf8" stroke-width="3.5"/>
  <rect class="grow" x="500" y="124" width="22" height="100" rx="5" fill="#101827" stroke="#38bdf8" stroke-width="3.5"/>
  <path d="M511 102V76M505 88l6-12 6 12" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tech line -->
  <text x="36" y="338" font-family="Consolas, ui-monospace, SFMono-Regular, monospace" font-size="13.5" font-weight="500" letter-spacing=".5" fill="#94a3b8">JAVASCRIPT · HTML · CSS</text>
</svg>
